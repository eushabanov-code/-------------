<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07150d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Колхоз">
    <title>Счётчик очков в Колхозе</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>Счётчик очков в Колхозе</h1>

        <!-- Экран создания игры -->
        <div id="game-setup" class="section">
            <h2>Создать новую игру</h2>
            <input type="text" id="game-name" placeholder="Название игры" required>
            <div class="date-field">
                <input type="date" id="game-date" required aria-label="Выбери дату">
                <span>Выбери дату</span>
            </div>
            <button id="create-game-btn">Создать игру</button>
        </div>

        <!-- Блок игроков -->
        <div id="players-section" class="section hidden">
            <h2>Игроки</h2>
            <div class="add-player">
                <input type="text" id="player-name" placeholder="Имя игрока">
                <button id="add-player-btn">Добавить игрока</button>
            </div>
            <ul id="players-list"></ul>
        </div>

        <!-- Блок партии -->
        <div id="round-section" class="section hidden">
            <h2>Новая партия</h2>
            <p>Итог считается как разница между игроком и следующим игроком по очереди</p>
            <div id="round-inputs"></div>
            <button id="add-round-btn">Добавить партию</button>
        </div>

        <!-- Таблица результатов -->
        <div id="results-section" class="section hidden">
            <h2>Результаты</h2>
            <p id="results-game-title" class="results-game-title"></p>
            <table id="results-table">
                <thead>
                    <tr id="header-row">
                        <th>Игрок</th>
                        <th>Итого</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>

        <!-- Сохранение -->
        <div id="save-section" class="section hidden">
            <button id="save-game-btn">Сохранить игру</button>
        </div>

        <!-- Список сохранённых игр -->
        <div id="saved-games-section" class="section">
            <h2>Сохранённые игры</h2>
            <ul id="saved-games-list"></ul>
        </div>
    </div>

    <div id="order-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="order-modal-title">
        <div class="modal-content">
            <h2 id="order-modal-title">Очередность ударов</h2>
            <div id="order-inputs"></div>
            <div class="modal-actions">
                <button id="confirm-order-btn">Добавить</button>
                <button id="cancel-order-btn" type="button">Отмена</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
